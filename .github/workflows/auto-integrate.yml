name: auto-integrate

# Consumer-side auto-integrate pipeline. Hourly cron picks one tool from
# the integration-drafts producer's staging area, audits + patches it,
# lands it in src/modulex_integrations/tools/<name>/, commits to
# staging only. Tagging is a manual operation (release-on-demand model).
#
# Configurable Repo Variables (set in Settings -> Variables):
#   PROVIDER             "primary" (default) | "fallback"
#   MODEL_ID             provider model identifier (primary path)
#   FALLBACK_MODEL_ID    provider model identifier (fallback path)
#   THINKING_BUDGET      default 32000
#   DRAFTS_REPO          producer repo (e.g. "<org>/<repo>") — no hardcoded default
#
# Required Repo Secrets (set in Settings -> Secrets):
#   AWS_ACCESS_KEY_ID    primary path credentials
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION
#   CLAUDE_CODE_OAUTH_TOKEN   fallback path credentials
#   DRAFTS_REPO_TOKEN    PAT with read scope on the producer repo (private)
#
# No gating. Cron runs unconditionally; tagging and release cutting
# are manual operations triggered by a human when ready.
#
# Inputs are read via env: blocks (never inline in run:) per the
# GitHub Actions injection-safety guidelines.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: 'Override default provider for this run'
        type: choice
        options: [default, primary, fallback]
        default: default
      override_tool:
        description: 'Force a specific tool name (skips the preselector)'
        required: false
        default: ''
      dry_run:
        description: 'Run audit + merge but skip the commit + push to staging'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: auto-integrate
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    outputs:
      skipped: ${{ steps.run.outputs.skipped }}
      tool_name: ${{ steps.run.outputs.tool_name }}

    steps:
      # ---- Checkout consumer + producer ---------------------------------
      # No external gate. Bot integrates tools to staging; tagging and
      # release cutting are manual operations (release-on-demand model).
      # The hourly cron runs unconditionally; in-pipeline checks decide
      # whether there is actually work to do.
      - name: Checkout consumer repo (staging)
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install consumer package editable
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Diagnose producer access (TEMPORARY - remove after debug)
        env:
          GH_TOKEN: ${{ secrets.DRAFTS_REPO_TOKEN }}
          DRAFTS_REPO: ${{ vars.DRAFTS_REPO }}
        run: |
          set +e
          echo "::group::1. Token + user identity (gh auth status + gh api user)"
          gh auth status 2>&1
          echo "---"
          gh api user --jq '{login,type}' 2>&1
          USER_EXIT=$?
          echo "gh api user exit: ${USER_EXIT}"
          echo "::endgroup::"

          echo "::group::2. Repo accessibility via REST API"
          gh api "repos/${DRAFTS_REPO}" 2>&1 | head -30
          API_EXIT=${PIPESTATUS[0]}
          echo "gh api repos exit: ${API_EXIT}"
          echo "::endgroup::"

          echo "::group::3. Raw git clone (bypassing gh, verbose)"
          GIT_TRACE=1 GIT_CURL_VERBOSE=1 git clone \
            --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${DRAFTS_REPO}.git" \
            /tmp/raw-clone-test 2>&1 | tail -60
          GIT_EXIT=${PIPESTATUS[0]}
          echo "git clone exit: ${GIT_EXIT}"
          rm -rf /tmp/raw-clone-test
          echo "::endgroup::"

          echo "::group::4. gh repo clone (the actual failing command)"
          GH_DEBUG=api gh repo clone "${DRAFTS_REPO}" /tmp/gh-clone-test -- --depth=1 2>&1 | tail -40
          GH_CLONE_EXIT=${PIPESTATUS[0]}
          echo "gh repo clone exit: ${GH_CLONE_EXIT}"
          rm -rf /tmp/gh-clone-test
          echo "::endgroup::"

          set -e
          echo "Diagnostic complete. Continuing to actual clone step (which will likely fail too)."

      - name: Clone producer repo
        env:
          GH_TOKEN: ${{ secrets.DRAFTS_REPO_TOKEN }}
          DRAFTS_REPO: ${{ vars.DRAFTS_REPO }}
        run: |
          set -eo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::DRAFTS_REPO_TOKEN secret not set; cannot clone producer."
            exit 1
          fi
          if [ -z "${DRAFTS_REPO}" ]; then
            echo "::error::DRAFTS_REPO variable not set (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi
          # Defensive clone: wrap with `set +e` so the script does
          # not die silently if pipefail downstream (find | head)
          # masks the real exit code. Explicitly print clone exit
          # and directory contents for forensic visibility.
          set +e
          git clone --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${DRAFTS_REPO}.git" \
            /tmp/drafts-clone
          CLONE_EXIT=$?
          echo "===GIT CLONE EXIT: ${CLONE_EXIT}==="
          if [ "${CLONE_EXIT}" -ne 0 ]; then
            echo "::error::git clone failed with exit ${CLONE_EXIT}"
            ls -la /tmp/ | head -10
            exit "${CLONE_EXIT}"
          fi
          echo "Clone tree top-level:"
          ls -la /tmp/drafts-clone/ | head -10
          set -e
          # Auto-detect the staging directory inside the clone. We look for
          # the deepest folder that contains <tool>/manifest.py files. This
          # avoids hardcoding the producer's internal subfolder name in
          # this committed YAML file.
          # `|| true` neutralizes SIGPIPE-induced exit 141 from
          # `find` when `head -1` closes the pipe early. Without
          # this, `set -eo pipefail` kills the script with no
          # visible error, masking a successful clone as a failure.
          FIRST_MANIFEST=$(find /tmp/drafts-clone -mindepth 3 -maxdepth 3 -name 'manifest.py' -type f 2>/dev/null | head -1 || true)
          if [ -z "${FIRST_MANIFEST}" ]; then
            FIRST_MANIFEST=$(find /tmp/drafts-clone -mindepth 2 -maxdepth 2 -name 'manifest.py' -type f 2>/dev/null | head -1 || true)
          fi
          if [ -z "${FIRST_MANIFEST}" ]; then
            echo "::error::Cloned drafts repo has no <tool>/manifest.py files at depth 2 or 3. Repo layout unrecognized."
            ls -la /tmp/drafts-clone/
            exit 1
          fi
          DRAFTS_DIR=$(dirname "$(dirname "${FIRST_MANIFEST}")")
          STAGED_COUNT=$(find "${DRAFTS_DIR}" -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "Auto-detected drafts directory: ${DRAFTS_DIR}"
          echo "Staged tools available: ${STAGED_COUNT}"
          echo "DRAFTS_DIR=${DRAFTS_DIR}" >> "${GITHUB_ENV}"

      - name: Determine provider
        id: provider
        env:
          DEFAULT_PROVIDER: ${{ vars.PROVIDER || 'primary' }}
          INPUT_PROVIDER: ${{ github.event.inputs.provider }}
        run: |
          PROVIDER="${DEFAULT_PROVIDER}"
          if [ -n "${INPUT_PROVIDER}" ] && [ "${INPUT_PROVIDER}" != "default" ]; then
            PROVIDER="${INPUT_PROVIDER}"
          fi
          echo "Using provider: ${PROVIDER}"
          echo "provider=${PROVIDER}" >> "${GITHUB_OUTPUT}"

      # ---- Run the Claude pipeline (primary) ----------------------------
      - name: Run auto-integrate (primary)
        id: run_primary
        if: steps.provider.outputs.provider == 'primary'
        uses: anthropics/claude-code-action@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ANTHROPIC_MODEL: ${{ vars.MODEL_ID || secrets.MODEL_ID }}
          DRAFTS_STAGING_DIR: ${{ env.DRAFTS_DIR }}
          OVERRIDE_TOOL: ${{ github.event.inputs.override_tool }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MODULEX_INTEGRATIONS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        with:
          use_bedrock: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --dangerously-skip-permissions
          show_full_output: 'true'
          prompt: |
            You are running unattended in GitHub Actions with bypass permissions and zero user interaction. Job: perform ONE consumer-side auto-integrate cycle, then exit. Do NOT commit or push - the workflow handles that after you finish.

            Procedure - follow `.claude/skills/integrate-staged-tool/SKILL.md` exactly:

            1. Read the skill in full.
            2. Read `.claude/docs/integration-audit-checklist.md` and `.claude/docs/popularity-tiers.md`.
            3. Invoke the integrate-staged-tool flow with DRAFTS_STAGING_DIR, OVERRIDE_TOOL, DRY_RUN environment variables already set.

            AMBIGUITY POLICY: Do NOT call AskUserQuestion. For risky-semantic patches, SKIP the patch, log it for human review, continue.

            FAILURE POLICY:
            - P1 (pending-release gate) hit: exit cleanly. No file changes.
            - P2 (preselector returns NONE): exit cleanly. No file changes.
            - Merger fails any gate: revert all worktree changes, exit cleanly. Worktree must be clean.
            - All phases succeed: the merger leaves `src/modulex_integrations/tools/<name>/` + pyproject.toml edit + CHANGELOG.md edit in the worktree. The workflow's next step detects this from filesystem state.

            ENVIRONMENT:
            - Consumer venv at `.venv/` (already installed editable).
            - Producer staging at `$DRAFTS_STAGING_DIR`.
            - Single-iteration; do not attempt a second tool.

      - name: Run auto-integrate (fallback)
        id: run_fallback
        if: steps.provider.outputs.provider == 'fallback'
        uses: anthropics/claude-code-action@v1
        env:
          DRAFTS_STAGING_DIR: ${{ env.DRAFTS_DIR }}
          OVERRIDE_TOOL: ${{ github.event.inputs.override_tool }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ANTHROPIC_MODEL: ${{ vars.FALLBACK_MODEL_ID }}
          MODULEX_INTEGRATIONS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --dangerously-skip-permissions
          show_full_output: 'true'
          prompt: |
            You are running unattended in GitHub Actions with bypass permissions and zero user interaction. Job: perform ONE consumer-side auto-integrate cycle, then exit. Do NOT commit or push.

            Procedure - follow `.claude/skills/integrate-staged-tool/SKILL.md` exactly:

            1. Read the skill in full.
            2. Read `.claude/docs/integration-audit-checklist.md` and `.claude/docs/popularity-tiers.md`.
            3. Invoke the integrate-staged-tool flow with DRAFTS_STAGING_DIR, OVERRIDE_TOOL, DRY_RUN environment variables already set.

            AMBIGUITY POLICY: Do NOT call AskUserQuestion. For risky-semantic patches, SKIP, log, continue.

            FAILURE POLICY:
            - P1 (pending-release gate) hit: exit cleanly. No file changes.
            - P2 (preselector returns NONE): exit cleanly. No file changes.
            - Merger fails any gate: revert all worktree changes, exit cleanly. Worktree must be clean.
            - All phases succeed: the merger leaves `src/modulex_integrations/tools/<name>/` + pyproject.toml edit + CHANGELOG.md edit in the worktree. The workflow's next step detects this from filesystem state.

      # ---- Detect pipeline result from filesystem state -------------------
      # We deliberately do NOT rely on the Claude action emitting outputs
      # (the action's $GITHUB_OUTPUT propagation is unreliable). Instead we
      # inspect the worktree: a successful integration leaves a new tool
      # directory under src/modulex_integrations/tools/ plus modifications
      # to pyproject.toml and CHANGELOG.md. A skip / silent revert leaves
      # the worktree clean.
      - name: Detect pipeline result
        id: run
        run: |
          set -eo pipefail
          # Find any new (untracked) tool directory the merger created.
          NEW_TOOL_DIR=$(git ls-files --others --exclude-standard --directory \
            | grep -E '^src/modulex_integrations/tools/[a-z][a-z0-9_]*/$' \
            | head -1 || true)

          if [ -z "${NEW_TOOL_DIR}" ]; then
            echo "::notice::Pipeline did not create a new tool directory."
            echo "Possible reasons:"
            echo "  - preselector returned NONE (no eligible candidates)"
            echo "  - auditor returned REFUSE on the picked tool"
            echo "  - merger ran into a gate failure and reverted cleanly"
            echo "  - dry_run was true"
            echo "tool_name=" >> "${GITHUB_OUTPUT}"
            echo "skipped=true" >> "${GITHUB_OUTPUT}"
            echo "failed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          TOOL_NAME=$(echo "${NEW_TOOL_DIR}" | sed -E 's|^src/modulex_integrations/tools/([^/]+)/$|\1|')
          echo "Detected new tool directory: ${NEW_TOOL_DIR}"
          echo "Tool name: ${TOOL_NAME}"

          # Sanity: pyproject.toml entry-point should be added, CHANGELOG updated.
          if git diff --quiet pyproject.toml; then
            echo "::warning::pyproject.toml not modified - entry-point may be missing for ${TOOL_NAME}"
          fi
          if [ -f CHANGELOG.md ] && git diff --quiet CHANGELOG.md; then
            echo "::notice::CHANGELOG.md not modified - consider adding an entry for ${TOOL_NAME}"
          fi

          echo "tool_name=${TOOL_NAME}" >> "${GITHUB_OUTPUT}"
          echo "skipped=false" >> "${GITHUB_OUTPUT}"
          echo "failed=false" >> "${GITHUB_OUTPUT}"

      # ---- Commit + push to staging (NO TAGGING) ---------------------------
      # Release-on-demand model: bot only commits the new integration to
      # staging. Tagging (alpha pre-release, stable) is a separate manual
      # operation triggered by the human when they decide to cut a release.
      # This avoids the GITHUB_TOKEN tag-push limitation entirely and keeps
      # PyPI cadence under human control.
      - name: Commit + push to staging
        if: steps.run.outputs.skipped != 'true' && steps.run.outputs.failed != 'true' && github.event.inputs.dry_run != 'true'
        env:
          TOOL_NAME: ${{ steps.run.outputs.tool_name }}
          PROVIDER: ${{ steps.provider.outputs.provider }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eo pipefail
          git config user.name "auto-integrate bot"
          git config user.email "credits+auto-integrate@modulex.dev"

          PR_BODY_FILE="/tmp/integrate-pr-body-${TOOL_NAME}.md"
          if [ ! -f "${PR_BODY_FILE}" ]; then
            echo "::warning::PR body file missing; using minimal stub."
            echo "Auto-integrated ${TOOL_NAME} from integration-drafts producer." > "${PR_BODY_FILE}"
          fi

          git add "src/modulex_integrations/tools/${TOOL_NAME}/"
          git add pyproject.toml CHANGELOG.md

          if git diff --cached --quiet; then
            echo "::warning::Nothing to commit; bailing."
            exit 0
          fi

          BODY=$(cat "${PR_BODY_FILE}")
          git commit \
            -m "auto-integrate: ${TOOL_NAME}" \
            -m "${BODY}" \
            -m "" \
            -m "Provider: ${PROVIDER}" \
            -m "Run: ${RUN_ID}" \
            -m "Co-Authored-By: auto-integrate bot <bot+auto-integrate@modulex.dev>"

          # Defensive push with rebase-on-reject. The 14-minute pipeline
          # window leaves room for a human to push to staging while the
          # bot is working. We retry up to 3 times, rebasing against the
          # current remote each round. A rebase conflict (rare —
          # typically only happens if two integrations touch the same
          # row in pyproject.toml or CHANGELOG.md) hard-fails: no silent
          # auto-merge, the human resolves and the next cron retries.
          for attempt in 1 2 3; do
            if git push origin staging; then
              echo "Pushed ${TOOL_NAME} integration to staging (attempt ${attempt}). No tag created."
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Push rejected on all 3 attempts. Aborting."
              exit 1
            fi
            echo "::notice::Push rejected on attempt ${attempt}; fetching + rebasing remote staging..."
            git fetch origin staging
            if ! git rebase origin/staging; then
              echo "::error::Rebase conflict during push retry. Manual intervention needed."
              git rebase --abort || true
              exit 1
            fi
          done
          echo "To cut a pre-release for this integration (and any others"
          echo "queued since the last tag), trigger the release-alpha"
          echo "workflow manually or ask a human to run \`git tag vX.Y.ZaN\`"
          echo "from a local checkout."

      # ---- Step summary ---------------------------------------------------
      - name: Step summary
        if: always()
        env:
          TOOL_NAME: ${{ steps.run.outputs.tool_name }}
          SKIPPED: ${{ steps.run.outputs.skipped }}
          FAILED: ${{ steps.run.outputs.failed }}
          PROVIDER: ${{ steps.provider.outputs.provider }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## auto-integrate run summary"
            echo ""
            if [ "${SKIPPED}" = "true" ]; then
              echo "**Outcome:** Skipped (pipeline)."
              echo ""
              echo "Reason: preselector returned NONE, or P1 in-skill gate fired."
            elif [ "${FAILED}" = "true" ]; then
              echo "**Outcome:** Pipeline failed - working tree reverted."
              echo ""
              echo "Tool attempted: \`${TOOL_NAME:-unknown}\`"
              echo ""
              echo "Next cron will try a different candidate."
            elif [ -n "${TOOL_NAME}" ]; then
              if [ "${DRY_RUN}" = "true" ]; then
                echo "**Outcome:** Dry run - no commit/push."
              else
                echo "**Outcome:** Integrated \`${TOOL_NAME}\` -> commit pushed to staging."
                echo ""
                echo "**No tag was created.** Tagging is a manual step in the"
                echo "release-on-demand model. When you are ready to cut an"
                echo "alpha pre-release, ask Claude in a chat session, or run"
                echo "from a local terminal:"
                echo ""
                echo "    git fetch origin"
                echo "    git checkout staging && git pull"
                echo "    git tag vX.Y.ZaN   # bump from latest"
                echo "    git push origin vX.Y.ZaN"
                echo ""
                echo "The tag push will fire release.yml and await your"
                echo "deployment approval at the release-pypi environment."
              fi
              echo ""
              echo "**Provider:** ${PROVIDER}"
            else
              echo "**Outcome:** Unknown - pipeline did not emit a tool name."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
